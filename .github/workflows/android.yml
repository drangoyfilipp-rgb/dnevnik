name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CERT_SHA256: 906748c6251e25a777a42b08cb292145f6ab23a93a0859c1c5c13c9debc64322
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Pub get, analyze, test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Signing (encrypted keystore + KEYSTORE_PASS secret)
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_PASS:-}" ]; then
            echo "::error::Actions secret KEYSTORE_PASS is not set"; exit 1
          fi
          # Accept the value pasted with or without the "KEYSTORE_PASS=" prefix.
          PASS="$(printf '%s' "$KEYSTORE_PASS" | tr -d '\r\n' | sed 's/^KEYSTORE_PASS=//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "::add-mask::$PASS"
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/app/release.p12.enc -out "$RUNNER_TEMP/release.p12" -pass pass:"$PASS"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=dnevnik\n' \
            "$RUNNER_TEMP/release.p12" "$PASS" "$PASS" > android/key.properties

      - name: Build APKs (versionCode = run number)
        run: |
          set -eu
          N=${{ github.run_number }}
          mkdir -p dist
          flutter build apk --release --target-platform android-arm64 --build-number $N --build-name 1.0.$N
          cp build/app/outputs/flutter-apk/app-release.apk dist/dnevnik-arm64.apk
          flutter build apk --release --build-number $N --build-name 1.0.$N
          cp build/app/outputs/flutter-apk/app-release.apk dist/dnevnik-universal.apk
          ls -la dist

      - name: Verify versionCode, targetSdk and signature
        run: |
          set -eu
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in dist/*.apk; do
            B=$($BT/aapt2 dump badging "$f")
            VC=$(printf '%s\n' "$B" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            TS=$(printf '%s\n' "$B" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" | head -1)
            MS=$(printf '%s\n' "$B" | sed -n "s/^\(min\)\?sdkVersion:'\([0-9]*\)'.*/\2/p" | head -1)
            CS=$(printf '%s\n' "$B" | sed -n "s/.*compileSdkVersion='\([0-9]*\)'.*/\1/p" | head -1)
            echo "$f versionCode=$VC targetSdk=$TS minSdk=$MS compileSdk=$CS"
            [ "$VC" = "${{ github.run_number }}" ] || { echo "::error::versionCode $VC != run number"; exit 1; }
            [ -n "$TS" ] && [ "$TS" -ge 35 ] || { echo "::error::targetSdk '$TS' < 35 (Play Protect warns about old apps)"; exit 1; }
            V=$($BT/apksigner verify --verbose --print-certs "$f")
            SHA=$(printf '%s\n' "$V" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            echo "$f cert=$SHA"
            printf '%s\n' "$V" | grep -E 'Verified using v[0-9]' || true
            [ "$SHA" = "$CERT_SHA256" ] || { echo "::error::unexpected signing certificate"; exit 1; }
            printf '%s\n' "$V" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' || { echo "::error::no v2 signature"; exit 1; }
            printf '%s\n' "$V" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' || { echo "::error::no v3 signature"; exit 1; }
            echo "APK_INFO=versionCode=$VC, targetSdk=$TS, minSdk=$MS, compileSdk=$CS, подпись v2+v3" >> "$GITHUB_ENV"
          done
          rm -f android/key.properties "$RUNNER_TEMP/release.p12"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Дневник — сборка ${{ github.run_number }}
          make_latest: true
          body: |
            Сборка ${{ github.run_number }} (${{ github.sha }}). ${{ env.APK_INFO }}
            Данные: «Госуслуги Моя школа» (www.gosuslugi.ru/school), работает офлайн.
            Для большинства телефонов: dnevnik-arm64.apk. Если не ставится — dnevnik-universal.apk.
          files: |
            dist/dnevnik-arm64.apk
            dist/dnevnik-universal.apk
